<!DOCTYPE html>

<html>   

   <head>

      <meta charset="UTF-8">   
      <link href="estilo.css" rel="stylesheet">   

   </head>

   <body>

      <div id="meu amor">

         <a href="#" id="botaoCarregar" class="link-cerveja">

            Carregando Cervejas...

         </a>

         <a href="#" id="botaoOrdenar" class="link-cerveja">

            Ordenando Cervejas...

         </a>

        <a href="#" id="botaoEmbaralhar" class="link-cerveja">

            Emabaralhando Cervejas...

         </a>

      </div>   

      </br>
      
      <table  class="tabela-cervejaria">
        
         <thead>

            <tr>

               <th>Cervejas</th>
            
            </tr>

         </thead>

         <tbody id="cervejas">

         </tbody>

      </table>

   </body>   

   <script>

      let cervejas = [
                     "The Legend of Zelda: Tears of the Kingdom",
                     "Minecraft",
                     "Elden Ring",
                     "The Witcher 3: Wild Hunt",
                     "Red Dead Redemption 2",
                     "Grand Theft Auto V",
                     "Cyberpunk 2077",
                     "God of War Ragnarök"
         ]

      
      let cerv_ordenado = cervejas.toSorted()
      const transformar = item => `<tr><td>${item}</td></tr>`
      let div = document.getElementById("cervejas")

      const carregarDiv = () => {

         let cervejasHtml = cervejas.map(transformar) 

         div.innerHTML = `${cervejasHtml.join("\n")}`

      }

      const ordenarDiV = () => {
          
         let cervejasHtml = cerv_ordenado.map(transformar)

         div.innerHTML = `${cervejasHtml.join("\n")}`
         
      }

      const aux_embaralhar = () => {

         let embaralhado = embaralhar(cervejas)

         let cervejasHtml = embaralhado.map(transformar)

         div.innerHTML = `${cervejasHtml.join("\n")}`
         
      }

      const embaralhar = (array) => {

         let copia = [...array]; 

         for (let i = copia.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [copia[i], copia[j]] = [copia[j], copia[i]]; 
         }

         return copia;
      }

      let botao = document.getElementById("botaoCarregar")
      let botao_ord = document.getElementById("botaoOrdenar")
      let botao_emb = document.getElementById("botaoEmbaralhar")

      botao_ord.addEventListener("click", ordenarDiV)
      botao.addEventListener("click", carregarDiv)       
      botao_emb.addEventListener('click', aux_embaralhar)          

   </script>

</html>
