<!DOCTYPE html>

<html>   

   <head>

      <meta charset="UTF-8">   
       <link href="estilo.css" rel="stylesheet">   

   </head>

   <body>

      <div id="meu amor">

         <button id="botaoCarregar" class="btn-cerveja">

            Carregando Cervejas...

         </button>

         <button id="botaoOrdenar" class="btn-cerveja">

            Ordenar Cervejas...

         </button>

         <button id="botaoEmbaralhar" class="btn-cerveja">

            Embaralhar Cervejas...

         </button>

      </div>   

      </br>
      
      <table  class="tabela-cervejaria">
        
         <thead>

            <tr>

               <th>Cervejas</th>
            
            </tr>

         </thead>

         <tbody id="cervejas">

         </tbody>

      </table>

   </body>   

   <script>

      let cervejas = ["Guiness", "Desperados", "Becks", "Brahma", "Corona"]
      let cerv_ordenado = cervejas.toSorted()

      const transformar = item => `<tr><td>${item}</td></tr>`

      let div = document.getElementById("cervejas")

      function carregarDiv(){

         let cervejasHtml = cervejas.map(transformar) 

         div.innerHTML = `${cervejasHtml.join("\n")}`

      }

      function ordenarDiV(){
          
         let cervejasHtml = cerv_ordenado.map(transformar)

         div.innerHTML = `${cervejasHtml.join("\n")}`
         
      }

      function aux_embaralhar(){

         let embaralhado = embaralhar(cervejas)

         console.log(embaralhado)

         let cervejasHtml = embaralhado.map(transformar)

         div.innerHTML = `${cervejasHtml.join("\n")}`
         
      }

      function embaralhar(array) {

         let copia = [...array]; 

         for (let i = copia.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [copia[i], copia[j]] = [copia[j], copia[i]]; 
         }

         return copia;
      }

      let botao = document.getElementById("botaoCarregar")
      let botao_ord = document.getElementById("botaoOrdenar")
      let botao_emb = document.getElementById("botaoEmbaralhar")

      botao_ord.addEventListener("click", ordenarDiV)
      botao.addEventListener("click", carregarDiv)       
      botao_emb.addEventListener('click', aux_embaralhar)          

   </script>

</html>
