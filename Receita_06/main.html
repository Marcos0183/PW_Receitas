      function tabCel(item){

         return `<tr>
            
            <td>${item['name']}</td>

            </tr>`

      }

      function loadCel(cs, idCel, atributo = ["name", "alcohol", "style", "ibu"]) {

         const divCel = document.getElementById(idCel)

         const itensHtml = cs.map(item => `<tr>${atributo.map(atr => `<td>${item[atr]}</td>`).join('')}</tr>`).join("\n")

         divCel.innerHTML = `${itensHtml}`

      }

      function loadCol(col = ["NOME", "ÁLCOOL,", "ESTILO", "AMARGOR", "ORIGEM"], idCol){

         const divCol = document.getElementById(idCol)

         const itensHTML = col.map(item => `<th>${item}</th>`).join("\n")

         divCol.innerHTML = `${itensHTML}`

      }
      
      
      const vetorIds = ["cervejasDiv", "columnDiv"]

      let botao = document.getElementById("botaoCarregar")

      botao.addEventListener("click", () => {
         loadCol(cervejas[0], vetorIds[1]);                       
         loadCel(cervejas.slice(1), vetorIds[0], Object.keys(cervejas[1]))
